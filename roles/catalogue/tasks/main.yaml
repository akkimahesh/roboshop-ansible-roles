- name: "download {{component}} application"
  ansible.builtin.import_role:
    name: common
    tasks_form: app-setup

- name: "nodejs setup for {{component}}"
  ansible.builtin.import_role:
    name: common
    tasks_form: nodejs

- name: "mongodb setup for {{component}}"
  ansible.builtin.import_role:
    name: common
    tasks_form: mongodb-setup

- name: "start {{component}} service"
  ansible.builtin.import_role:
    name: common
    tasks_form: systemd